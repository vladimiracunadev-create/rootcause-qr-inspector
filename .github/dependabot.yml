version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # This upper bound is deliberate: crossing it breaks dependency resolution.
    # See docs/quality/LOCKFILE.md before lifting it.
    ignore:
      # pdfrx >= 2.4.6 pulls archive ^4, incompatible with the archive ^3.6.1
      # required by excel 4.0.6.
      - dependency-name: pdfrx
        versions: [">=2.4.6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
