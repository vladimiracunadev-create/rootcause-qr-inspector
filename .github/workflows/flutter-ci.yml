name: Flutter quality and compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality:
    name: Analyze/test + Android artifact + web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Offline structure checks
        run: |
          uv run --with pyyaml python tool/validate_structure.py --require-lock
          python3 tool/verify_rootcause_contract.py
      - name: Generate Android project and web demo
        run: python3 tool/bootstrap.py --platforms android,web
      - name: Verify dependency resolution
        run: |
          test -f pubspec.lock
          flutter pub deps --style=compact
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Generate SBOM and license inventory
        run: |
          uv run --with pyyaml python tool/generate_sbom.py
          python3 tool/generate_license_inventory.py
      - name: Build web demo
        run: flutter build web --release
      - name: Build Android installable release APK
        run: flutter build apk --release
      - name: Checksums
        run: python3 tool/generate_checksums.py build/app/outputs/flutter-apk/app-release.apk > build/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-web-quality-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web
            build/reports/sbom.cdx.json
            build/reports/dependency-licenses.json
            build/checksums.txt
            coverage/lcov.info
            pubspec.lock
            test_assets/manifest.json

  ios:
    name: Build (iOS simulator)
    # Xcode exige un host macOS; este runner solo compila iOS y no genera una app macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate iOS project
        run: python3 tool/bootstrap.py --platforms ios
      - name: Build iOS simulator (no signing identity required)
        run: flutter build ios --debug --simulator
