name: Flutter quality and compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality:
    name: Analyze/test + Android artifact + web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Pin the JDK
        # El JDK era la única pieza sin fijar de una cadena que sí fija
        # Flutter, Gradle, AGP y Kotlin. Cuando el runner pasó a un JDK 25,
        # AGP 8.11.1 falló con un mensaje que era solo la versión: `25.0.5`.
        # Java 21 es el LTS con el que esta combinación está probada.
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Offline structure checks
        run: |
          uv run --with pyyaml python tool/validate_structure.py --require-lock
          python3 tool/verify_rootcause_contract.py
          python3 tool/generate_identity_data.py --check
      - name: Generate Android project and web demo
        run: python3 tool/bootstrap.py --platforms android,web
      - name: Verify dependency resolution
        run: |
          test -f pubspec.lock
          flutter pub deps --style=compact
      - name: Format
        # El formato era la única puerta que el repositorio no cerraba, y dos
        # archivos ya estaban dentro sin formatear. Un gate que no se ejecuta
        # no es un gate.
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Generate SBOM and license inventory
        run: |
          uv run --with pyyaml python tool/generate_sbom.py
          python3 tool/generate_license_inventory.py
      - name: Build web demo
        run: flutter build web --release
      - name: Build Android installable release APK
        run: flutter build apk --release
      - name: Checksums
        run: python3 tool/generate_checksums.py build/app/outputs/flutter-apk/app-release.apk > build/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-web-quality-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web
            build/reports/sbom.cdx.json
            build/reports/dependency-licenses.json
            build/checksums.txt
            coverage/lcov.info
            pubspec.lock
            test_assets/manifest.json

  ios:
    name: Build (iOS simulator)
    # Xcode exige un host macOS; este runner solo compila iOS y no genera una app macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pin the JDK
        # El JDK era la única pieza sin fijar de una cadena que sí fija
        # Flutter, Gradle, AGP y Kotlin. Cuando el runner pasó a un JDK 25,
        # AGP 8.11.1 falló con un mensaje que era solo la versión: `25.0.5`.
        # Java 21 es el LTS con el que esta combinación está probada.
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate iOS project
        run: python3 tool/bootstrap.py --platforms ios
      - name: Build iOS simulator (no signing identity required)
        run: flutter build ios --debug --simulator
