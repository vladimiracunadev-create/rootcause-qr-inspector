name: Flutter quality and compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality:
    name: Analyze, test and build (Android + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python tooling
        run: python3 -m pip install --upgrade pyyaml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Offline structure checks
        run: |
          python3 tool/validate_structure.py --require-lock
          python3 tool/verify_rootcause_contract.py
      - name: Generate Android and web projects
        run: python3 tool/bootstrap.py --platforms android,web
      - name: Verify dependency resolution
        run: |
          test -f pubspec.lock
          flutter pub deps --style=compact
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Generate SBOM and license inventory
        run: |
          python3 tool/generate_sbom.py
          python3 tool/generate_license_inventory.py
      - name: Build web
        run: flutter build web --release
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Checksums
        run: python3 tool/generate_checksums.py build/app/outputs/flutter-apk/app-debug.apk > build/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-web-quality-artifacts
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/web
            build/reports/sbom.cdx.json
            build/reports/dependency-licenses.json
            build/checksums.txt
            coverage/lcov.info
            pubspec.lock
            test_assets/manifest.json

  apple:
    name: Build (iOS + macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Apple projects
        run: python3 tool/bootstrap.py --platforms ios,macos
      - name: Build iOS simulator (no signing identity required)
        run: flutter build ios --debug --simulator
      - name: Build macOS
        run: flutter build macos --release
      # The startup integration test is intentionally not run here: GitHub's
      # macOS runners have no interactive graphical session, so the built app
      # launches without ever establishing a debug connection. Run it locally
      # with `flutter test integration_test/app_launch_test.dart -d macos`.
