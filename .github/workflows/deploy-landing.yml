# ─────────────────────────────────────────────────────────────────────────────
# Deploy Landing Page — RootCause QR Inspector
#
# Publica en GitHub Pages un sitio con dos partes:
#   /      → la landing estática de landing/
#   /app/  → demo web compilada, con su base href
#
# El icono se copia desde la única fuente versionada en assets/launcher/.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "docs/images/android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/bootstrap.py"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.7
  # Debe empezar y terminar en «/»: es la ruta de la demo, no una plataforma del producto.
  DEMO_BASE_HREF: /rootcause-qr-inspector/app/

jobs:
  deploy:
    name: Publicar landing y demo web en GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Entorno de despliegue de GitHub Pages; no es una plataforma de la app.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the web project
        run: python3 tool/bootstrap.py --platforms web

      - name: Build the web demo
        run: flutter build web --release --base-href "$DEMO_BASE_HREF"

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r landing _site
          touch _site/.nojekyll
          mkdir -p _site/assets
          mkdir -p _site/assets/android
          cp assets/launcher/web/Icon-512.png _site/assets/icon-512.png
          cp docs/images/android/*.png _site/assets/android/
          cp -r build/web _site/app
          test -f _site/app/index.html
          test -f _site/assets/icon-512.png
          test -f _site/assets/android/android-inspector-home.png
          test -f _site/assets/android/android-generator.png
          test -f _site/assets/android/android-settings.png
          test -f _site/assets/android/android-analysis-result.png
          test -f _site/assets/android/android-tablet-generator.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
